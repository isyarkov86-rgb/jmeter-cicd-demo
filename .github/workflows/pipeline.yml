name: Run JMeter Load Test

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  load-test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean old reports
        shell: cmd
        run: |
          if exist results.jtl del /f /q results.jtl
          if exist html_report rmdir /s /q html_report

      - name: Execute JMeter Test
        shell: cmd
        run: |
          "C:\JMeter\apache-jmeter-5.6.3\bin\jmeter.bat" -n -t test.jmx -l results.jtl -e -o html_report

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JMeter-HTML-Report
          path: html_report/
